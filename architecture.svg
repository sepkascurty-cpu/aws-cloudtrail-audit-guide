<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#232F3E">AWS CloudTrail — Audit Logging Architecture</text>
  <text x="30" y="66" font-size="15" fill="#666666">Every API call recorded &#183; logs locked in a dedicated account &#183; alarms on the events that matter &#183; Athena for investigations</text>

  <!-- AWS Cloud boundary -->
  <rect x="20" y="85" width="1160" height="870" fill="none" stroke="#232F3E" stroke-width="2"/>
  <rect x="20" y="85" width="46" height="46" fill="#232F3E"/>
  <text x="43" y="115" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">aws</text>
  <text x="78" y="115" font-size="17" fill="#232F3E">AWS Cloud</text>

  <!-- ===== Actors (top left) ===== -->
  <g>
    <rect x="60" y="150" width="220" height="110" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="60" y="150" width="220" height="30" fill="#FF9900"/>
    <text x="170" y="171" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Actors</text>
    <text x="170" y="205" font-size="14" fill="#232F3E" text-anchor="middle">IAM users &amp; roles</text>
    <text x="170" y="228" font-size="13" fill="#666666" text-anchor="middle">Console &#183; CLI &#183; SDK</text>
    <text x="170" y="248" font-size="12" fill="#666666" text-anchor="middle">every API call is an event</text>
  </g>

  <!-- Arrow 1: actors -> CloudTrail -->
  <line x1="280" y1="205" x2="470" y2="205" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="190" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">1. API calls</text>

  <!-- ===== CloudTrail (top center) ===== -->
  <g>
    <rect x="470" y="150" width="260" height="110" fill="#F3EDFA" stroke="#7B5EA7" stroke-width="2"/>
    <rect x="470" y="150" width="260" height="30" fill="#7B5EA7"/>
    <text x="600" y="171" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS CloudTrail</text>
    <text x="600" y="205" font-size="14" fill="#232F3E" text-anchor="middle">Multi-region trail</text>
    <text x="600" y="228" font-size="13" fill="#666666" text-anchor="middle">management + data events</text>
    <text x="600" y="248" font-size="12" fill="#666666" text-anchor="middle">log file validation: ON</text>
  </g>

  <!-- Arrow: CloudTrail -> GuardDuty -->
  <line x1="730" y1="205" x2="900" y2="205" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="190" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">feeds</text>

  <!-- ===== GuardDuty (top right) ===== -->
  <g>
    <rect x="900" y="150" width="220" height="110" fill="#FDECEC" stroke="#D13239" stroke-width="2"/>
    <rect x="900" y="150" width="220" height="30" fill="#D13239"/>
    <text x="1010" y="171" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon GuardDuty</text>
    <text x="1010" y="205" font-size="14" fill="#232F3E" text-anchor="middle">Threat detection</text>
    <text x="1010" y="228" font-size="13" fill="#666666" text-anchor="middle">anomaly findings</text>
    <text x="1010" y="248" font-size="12" fill="#666666" text-anchor="middle">from the same trail</text>
  </g>

  <!-- ===== Logging account (dashed, left) ===== -->
  <rect x="60" y="320" width="540" height="330" fill="none" stroke="#1E8A46" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="330" y="348" font-size="15" fill="#1E8A46" text-anchor="middle">Logging account — dedicated, no workloads</text>

  <!-- S3 log archive -->
  <g>
    <rect x="90" y="365" width="230" height="110" fill="#EAF6EC" stroke="#1E8A46" stroke-width="2"/>
    <rect x="90" y="365" width="230" height="28" fill="#1E8A46"/>
    <text x="205" y="384" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon S3 — Log archive</text>
    <text x="205" y="412" font-size="14" fill="#232F3E" text-anchor="middle">cloudtrail-logs-archive</text>
    <text x="205" y="433" font-size="12" fill="#666666" text-anchor="middle">Object Lock (Compliance)</text>
    <text x="205" y="452" font-size="12" fill="#666666" text-anchor="middle">SSE-KMS &#183; 90-day+ retention</text>
  </g>
  <!-- KMS -->
  <g>
    <rect x="340" y="365" width="230" height="110" fill="#FDECEC" stroke="#D13239" stroke-width="2"/>
    <rect x="340" y="365" width="230" height="28" fill="#D13239"/>
    <text x="455" y="384" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS KMS</text>
    <text x="455" y="412" font-size="14" fill="#232F3E" text-anchor="middle">archive key</text>
    <text x="455" y="433" font-size="12" fill="#666666" text-anchor="middle">only trail writes</text>
    <text x="455" y="452" font-size="12" fill="#666666" text-anchor="middle">only auditors read</text>
  </g>
  <!-- Arrow: S3 -> KMS (encrypts) -->
  <line x1="320" y1="420" x2="340" y2="420" stroke="#D13239" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="408" font-size="11" fill="#D13239" text-anchor="middle">enc</text>
  <!-- Athena -->
  <g>
    <rect x="90" y="505" width="230" height="110" fill="#EAF2FA" stroke="#2E6DA4" stroke-width="2"/>
    <rect x="90" y="505" width="230" height="28" fill="#2E6DA4"/>
    <text x="205" y="524" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon Athena</text>
    <text x="205" y="552" font-size="14" fill="#232F3E" text-anchor="middle">SQL over the archive</text>
    <text x="205" y="573" font-size="12" fill="#666666" text-anchor="middle">partitioned by date</text>
    <text x="205" y="592" font-size="12" fill="#666666" text-anchor="middle">who did what, when?</text>
  </g>
  <!-- Arrow: S3 -> Athena -->
  <line x1="205" y1="475" x2="205" y2="505" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="495" font-size="12" fill="#232F3E">6. Query</text>
  <!-- Security Hub -->
  <g>
    <rect x="340" y="505" width="230" height="110" fill="#FDECEC" stroke="#D13239" stroke-width="2"/>
    <rect x="340" y="505" width="230" height="28" fill="#D13239"/>
    <text x="455" y="524" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Security Hub</text>
    <text x="455" y="552" font-size="14" fill="#232F3E" text-anchor="middle">Central findings</text>
    <text x="455" y="573" font-size="12" fill="#666666" text-anchor="middle">GuardDuty + trail signals</text>
    <text x="455" y="592" font-size="12" fill="#666666" text-anchor="middle">one pane of glass</text>
  </g>
  <!-- GuardDuty findings flow to Security Hub (noted in-box; no diagonal crossing) -->
  <text x="1010" y="278" font-size="12" fill="#D13239" text-anchor="middle">findings &#8594; Security Hub</text>

  <!-- Arrow 2: CloudTrail -> S3 archive -->
  <line x1="560" y1="260" x2="205" y2="365" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="300" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">2. Write log files (5-min batches)</text>

  <!-- ===== Workload account (dashed, right) ===== -->
  <rect x="640" y="320" width="500" height="330" fill="none" stroke="#7B5EA7" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="890" y="348" font-size="15" fill="#7B5EA7" text-anchor="middle">Workload account — real-time detection</text>

  <!-- CloudWatch Logs -->
  <g>
    <rect x="670" y="365" width="220" height="110" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="670" y="365" width="220" height="28" fill="#FF9900"/>
    <text x="780" y="384" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CloudWatch Logs</text>
    <text x="780" y="412" font-size="14" fill="#232F3E" text-anchor="middle">metric filters</text>
    <text x="780" y="433" font-size="12" fill="#666666" text-anchor="middle">StopLogging &#183; DeleteTrail</text>
    <text x="780" y="452" font-size="12" fill="#666666" text-anchor="middle">ConsoleLogin failures</text>
  </g>
  <!-- EventBridge -->
  <g>
    <rect x="910" y="365" width="220" height="110" fill="#F3EDFA" stroke="#7B5EA7" stroke-width="2"/>
    <rect x="910" y="365" width="220" height="28" fill="#7B5EA7"/>
    <text x="1020" y="384" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon EventBridge</text>
    <text x="1020" y="412" font-size="14" fill="#232F3E" text-anchor="middle">Event rules</text>
    <text x="1020" y="433" font-size="12" fill="#666666" text-anchor="middle">match high-risk calls</text>
    <text x="1020" y="452" font-size="12" fill="#666666" text-anchor="middle">route in real time</text>
  </g>
  <!-- Arrow 3: CloudTrail -> CloudWatch Logs -->
  <line x1="660" y1="260" x2="780" y2="365" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="310" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">3. Stream events</text>
  <!-- Arrow 4: CloudTrail -> EventBridge -->
  <line x1="700" y1="260" x2="1020" y2="365" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="300" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">4. Route events</text>

  <!-- CloudWatch Alarms -->
  <g>
    <rect x="670" y="505" width="220" height="110" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="670" y="505" width="220" height="28" fill="#FF9900"/>
    <text x="780" y="524" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CloudWatch Alarms</text>
    <text x="780" y="552" font-size="14" fill="#232F3E" text-anchor="middle">1 occurrence = page</text>
    <text x="780" y="573" font-size="12" fill="#666666" text-anchor="middle">trail tampering</text>
    <text x="780" y="592" font-size="12" fill="#666666" text-anchor="middle">privilege escalation</text>
  </g>
  <!-- Arrow: CloudWatch Logs -> Alarms -->
  <line x1="780" y1="475" x2="780" y2="505" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="495" font-size="12" fill="#232F3E">5. Trigger</text>
  <!-- Lambda auto-remediation -->
  <g>
    <rect x="910" y="505" width="220" height="110" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="910" y="505" width="220" height="28" fill="#FF9900"/>
    <text x="1020" y="524" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Lambda</text>
    <text x="1020" y="552" font-size="14" fill="#232F3E" text-anchor="middle">auto-remediation</text>
    <text x="1020" y="573" font-size="12" fill="#666666" text-anchor="middle">re-enable logging</text>
    <text x="1020" y="592" font-size="12" fill="#666666" text-anchor="middle">revoke leaked keys</text>
  </g>
  <!-- Arrow: EventBridge -> Lambda -->
  <line x1="1020" y1="475" x2="1020" y2="505" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1035" y="495" font-size="12" fill="#232F3E">7. Invoke</text>

  <!-- ===== SNS / on-call (bottom) ===== -->
  <g>
    <rect x="60" y="690" width="540" height="70" fill="#FDEEF4" stroke="#D13239" stroke-width="2"/>
    <text x="330" y="717" font-size="14" font-weight="bold" fill="#D13239" text-anchor="middle">Amazon SNS — On-call paging</text>
    <text x="330" y="740" font-size="12" fill="#666666" text-anchor="middle">alarms + EventBridge rules notify the team &#183; a trail nobody watches is a camera nobody looks at</text>
  </g>
  <!-- Arrow: Alarms -> SNS -->
  <line x1="780" y1="615" x2="780" y2="690" stroke="#D13239" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="795" y="655" font-size="12" font-weight="bold" fill="#D13239">page on-call</text>
  <line x1="1020" y1="615" x2="1020" y2="690" stroke="#D13239" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ===== 90-day note (bottom right) ===== -->
  <g>
    <rect x="640" y="690" width="500" height="70" fill="#EAF6EC" stroke="#1E8A46" stroke-width="2"/>
    <text x="890" y="717" font-size="14" font-weight="bold" fill="#1E8A46" text-anchor="middle">Event history keeps only 90 days</text>
    <text x="890" y="740" font-size="12" fill="#666666" text-anchor="middle">anything older must live in the S3 archive — or it is gone</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="30" y="800" font-size="12" fill="#999999">Flow: Actors &#8594; CloudTrail (multi-region) &#8594; S3 archive (logging account) + CloudWatch Logs / EventBridge (workload account) &#8594; Alarms &#8594; SNS &#8594; on-call &#183; Athena investigates the archive</text>
  <text x="30" y="972" font-size="12" fill="#999999">Data events (S3 / Lambda) are opt-in and billed per event — enable only on sensitive resources.</text>
</svg>
